name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    # The full publication/serving suite can exceed 15 minutes on hosted runners.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app explorer tools

      - name: Validate connector contracts
        run: python -m app.cli validate-pipeline

      - name: Validate reviewed publication release
        run: python -m app.cli publication validate

      - name: Validate public repository boundary
        run: python tools/validate_public_repo.py

      - name: Run regression suite
        run: python -m pytest -q
