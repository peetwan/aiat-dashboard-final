name: Safe Auto Merge

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: enable-auto-merge
    if: github.event.label.name == 'codex-automerge' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify trusted label and protected paths
        id: verify
        uses: actions/github-script@v9
        with:
          script: |
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const allowed = new Set(['admin', 'maintain', 'write']);
            if (!allowed.has(permission.data.permission)) {
              core.setFailed(`Actor ${context.actor} cannot authorize auto-merge.`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const protectedPaths = [
              '.github/workflows/',
              '.github/CODEOWNERS',
              'AGENTS.md',
              'SECURITY.md',
            ];
            const blocked = files
              .map(file => file.filename)
              .filter(filename => protectedPaths.some(path => filename === path || filename.startsWith(path)));
            if (blocked.length) {
              core.setFailed(`Workflow/review-policy changes require manual merge: ${blocked.join(', ')}`);
            }

      - name: Enable squash auto-merge after required checks pass
        if: steps.verify.outcome == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            await github.graphql(`
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number autoMergeRequest { enabledAt } }
                }
              }
            `, { pullRequestId: context.payload.pull_request.node_id });
            core.notice('Auto-merge enabled; GitHub will wait for branch protection and required CI.');
