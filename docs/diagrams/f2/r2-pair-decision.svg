      #r2-pair-decision-root .diagram-container { width: 100%; overflow-x: auto; margin-bottom: 2rem; }
      #r2-pair-decision-root .lead { font-size: 1rem; line-height: 1.6; color: #13251e; max-width: 60rem; margin-bottom: 1.75rem; }
      #r2-pair-decision-root .notes { font-size: 0.875rem; line-height: 1.6; color: #617068; max-width: 60rem; padding-left: 1.2rem; }
