<title id="r2-pair-decision-title">คู่ระเบียนหนึ่งคู่ถูกตัดสินอย่างไร</title>
<desc id="r2-pair-decision-desc">Flowchart: a candidate pair first follows a person's reviewed decision if one exists; otherwise the rule outcome merges or separates it; an unclear pair is separated if the LLM answered different with high confidence (innovations and products); otherwise it waits for review, and the reviewer's decision is used on the next run.</desc>
