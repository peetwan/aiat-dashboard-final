<svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="r1-f2-end-to-end-title r1-f2-end-to-end-desc" id="r1-f2-end-to-end-root">
<title id="r1-f2-end-to-end-title">F2 ตั้งแต่เว็บไซต์ต้นทางถึงแดชบอร์ด</title>
<desc id="r1-f2-end-to-end-desc">Architecture of F2 in three zones: external services (source websites, the private Cloudflare R2 evidence bucket, OpenRouter), the maintainer's machine where raw snapshots, the pipeline, decision files with personal names and the release candidate stay out of Git, and the public side (GitHub repository and the Railway deployment).</desc>
