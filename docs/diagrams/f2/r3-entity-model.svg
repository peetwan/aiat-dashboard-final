<title id="r3-entity-model-title">F2 นับอะไร และสิ่งเหล่านั้นเชื่อมกันอย่างไร</title>
<desc id="r3-entity-model-desc">Conceptual data model: innovations, people, businesses, products, product families, cultural records and activities, with the source-reported totals that are not entities; each box names the KPI it feeds. People relate to innovations and cultural records; businesses sell or make products; products group into families (K07 counts families); businesses and products can be found in the text of innovation and cultural records.</desc>
